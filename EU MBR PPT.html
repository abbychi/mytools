<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EU MBR 可视化工具</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--a:#ff6a00;--bg:#f4f5f7;--c:#fff;--t:#1a1a1a;--s:#777;--bd:#e4e4e4;--g:#1a8c2d;--r:#c62828;--b:#1565c0}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);font-size:13px}
header{background:linear-gradient(135deg,#ff6a00,#e8457c);color:#fff;padding:13px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.1)}
header h1{font-size:1.05rem;white-space:nowrap}header .r{margin-left:auto;font-size:.75rem;opacity:.85}
.wrap{max-width:1360px;margin:0 auto;padding:16px 20px}
.ph{text-align:center;padding:70px 20px;color:var(--s)}.ph .ic{font-size:3.2rem;margin-bottom:10px}
.g{display:grid;gap:12px;margin-bottom:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:960px){.g2,.g3{grid-template-columns:1fr}}
.cd{background:var(--c);border-radius:10px;padding:14px;border:1px solid var(--bd);margin-bottom:12px}
.cd-t{font-size:.84rem;font-weight:600;margin-bottom:8px}
.kr{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:14px}
.kc{background:var(--c);border-radius:10px;padding:10px 8px;border:1px solid var(--bd);text-align:center}
.kc .l{font-size:.64rem;color:var(--s);margin-bottom:1px}.kc .v{font-size:1.15rem;font-weight:700;color:var(--a)}
.kc .ch{font-size:.66rem;margin-top:1px}.up{color:var(--g)}.dn{color:var(--r)}
.st{font-size:1.1rem;font-weight:700;margin:22px 0 4px;padding-left:8px;border-left:4px solid var(--a)}
.ss{font-size:.76rem;color:var(--s);margin-bottom:12px;padding-left:12px}
.site-hd{font-size:.95rem;font-weight:700;margin:16px 0 6px;color:var(--b)}
.summary{background:#fffbf5;border:1px solid #ffe0b2;border-radius:8px;padding:10px 12px;margin:10px 0 14px;font-size:.76rem;line-height:1.55;color:#5d4037}
.summary b{color:var(--a)}
.tw{max-height:420px;overflow:auto;border:1px solid var(--bd);border-radius:8px}
table.dt{width:100%;border-collapse:collapse;font-size:.72rem}
.dt th,.dt td{padding:5px 6px;text-align:right;border-bottom:1px solid #f0f0f0}
.dt th{background:#fff8f2;color:var(--a);font-weight:600;position:sticky;top:0;z-index:1}
.dt th:first-child,.dt td:first-child{text-align:left}.dt tr:hover td{background:#fff5ee}
.tg{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.64rem;font-weight:600}
.tg-u{background:#e8f5e9;color:var(--g)}.tg-d{background:#fce4ec;color:var(--r)}
.il{display:flex;flex-direction:column;gap:7px}
.ic{background:var(--c);border-radius:8px;padding:10px;border:1px solid var(--bd);border-left:4px solid var(--r)}
.ic.op{border-left-color:var(--g)}.ic.w{border-left-color:#f57f17}
.ic h4{font-size:.76rem;margin-bottom:2px}.ic p{font-size:.69rem;color:var(--s);line-height:1.4}
.nm{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--a);color:#fff;font-size:.6rem;font-weight:700;margin-right:3px}
.btn-pdf{background:#fff;color:var(--a);border:none;padding:6px 14px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-pdf:hover{background:#fff3e0;transform:scale(1.03)}.btn-pdf:disabled{opacity:.5;cursor:not-allowed}
/* section color bands */
.sec{border-radius:12px;padding:18px 16px 8px;margin-bottom:18px}
.sec .st{margin-top:0}
.sec-1{background:linear-gradient(135deg,#fff8f0 0%,#fff3e6 100%);border:1px solid #ffe0b2}
.sec-1 .st{border-left-color:#ff6a00}
.sec-2{background:linear-gradient(135deg,#f5f5f5 0%,#eeeeee 100%);border:1px solid #e0e0e0}
.sec-2 .st{border-left-color:#555}
.sub-blk{border-radius:8px;padding:12px 10px 6px;margin:8px 0;background:#fff;border:1px solid #e0e0e0}
.sub-blk-t{font-size:.78rem;font-weight:700;margin-bottom:8px;color:var(--t)}
/* sec-1 全站总览：所有子区块统一橙色 */
.sec-1 .sub-blk{border-left:4px solid #ff6a00}
/* 站点颜色 */
.site-de{--sc:#ff6a00;--sc-bg:#fff8f0;--sc-bd:#ffe0b2;--sc-grad:linear-gradient(135deg,#fff8f0,#fff3e6)}
.site-es{--sc:#e8457c;--sc-bg:#fff5f8;--sc-bd:#f8bbd0;--sc-grad:linear-gradient(135deg,#fff5f8,#fce4ec)}
.site-fr{--sc:#1565c0;--sc-bg:#f0f7ff;--sc-bd:#bbdefb;--sc-grad:linear-gradient(135deg,#f0f7ff,#e8f0fe)}
.site-it{--sc:#2e7d32;--sc-bg:#f1f8f1;--sc-bd:#c8e6c9;--sc-grad:linear-gradient(135deg,#f1f8f1,#e8f5e9)}
.site-uk{--sc:#6a1b9a;--sc-bg:#faf5ff;--sc-bd:#e1bee7;--sc-grad:linear-gradient(135deg,#faf5ff,#f3e5f5)}
.site-blk{background:var(--sc-bg,#fff);border-radius:10px;padding:14px 12px 6px;margin-bottom:14px;border:1px solid var(--sc-bd,#e0e0e0);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.site-blk .site-hd{color:var(--sc,#333)}
.site-blk .sub-blk{border-left:4px solid var(--sc,#ff6a00)}
.site-blk .summary{border-color:var(--sc-bd,#ffe0b2);background:var(--sc-bg,#fffbf5)}
.site-blk .summary b{color:var(--sc,var(--a))}
.site-blk .kc .v{color:var(--sc,var(--a))}
.site-blk .cd-t{color:var(--sc,var(--a))}
.site-blk .dt th{background:var(--sc-bg,#fff8f2);color:var(--sc,var(--a))}
.sec-3{background:linear-gradient(135deg,#f5fff5 0%,#edf7ed 100%);border:1px solid #c8e6c9}
.sec-3 .st{border-left-color:#1a8c2d}
.sec-4{background:linear-gradient(135deg,#fef5ff 0%,#f8ecfc 100%);border:1px solid #e1bee7}
.sec-4 .st{border-left-color:#8e24aa}
.sec-asin{background:linear-gradient(135deg,#f0f7ff 0%,#e8f0fe 100%);border:1px solid #bbdefb}
.sec-asin .st{border-left-color:#1565c0}
.sec-asin .sub-blk{border-left:4px solid #1565c0}
.sec-asin .dt th{background:#f0f7ff;color:#1565c0}
/* upload labels */
.upload-grp{display:flex;align-items:center;gap:6px}
.upload-grp label{font-size:.72rem;font-weight:600;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px;white-space:nowrap;cursor:pointer}
.upload-grp label:hover{background:rgba(255,255,255,.35)}
.upload-grp input[type=file]{width:0;height:0;overflow:hidden;position:absolute;opacity:0}
.upload-grp .fname{font-size:.68rem;opacity:.9;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media print{
  header{position:relative!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tw{max-height:none!important;overflow:visible!important}
  .btn-pdf{display:none!important}
  .ph{display:none!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec,.cd,.sub-blk,.site-blk,.summary,.kc,.ic{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>📊 EU MBR 可视化工具</h1>
  <div class="upload-grp">
    <label for="fi2">① 上传 CID 汇总数据</label>
    <input type="file" id="fi2" accept=".csv,.xlsx,.xls,.tsv">
    <span id="us2" class="fname"></span>
  </div>
  <div class="upload-grp">
    <label for="fi">② 上传 ITK/BN 数据</label>
    <input type="file" id="fi" accept=".csv,.xlsx,.xls,.tsv">
    <span id="us" class="fname"></span>
  </div>
  <div class="upload-grp">
    <label for="fi3">③ 上传 ASIN 数据</label>
    <input type="file" id="fi3" accept=".csv,.xlsx,.xls,.tsv">
    <span id="us3" class="fname"></span>
  </div>
  <button class="btn-pdf" id="btnPdf" onclick="exportPDF()" disabled>📄 导出 PDF</button>
  <span class="r">① CID：卖家整体运营数据 &nbsp; ② ITK/BN：按品类拆分 &nbsp; ③ ASIN：单品级数据</span>
</header>
<div class="wrap">
  <div id="ph" class="ph"><div class="ic">📂</div><p>请先点击 <b>① 上传 CID 汇总数据</b>（卖家整体运营指标，含广告/新品/库存等）<br>再点击 <b>② 上传 ITK/BN 数据</b>（按品类拆分的月度 Performance 数据）<br>可选 <b>③ 上传 ASIN 数据</b>（单品级 Performance 数据）</p></div>
  <div id="main" style="display:none"></div>
</div>
<script>
const SITES=['DE','ES','FR','IT','UK'],
CL=['#ff6a00','#ff9a44','#e8457c','#ffb74d','#f06292'],
FL={DE:'🇩🇪',ES:'🇪🇸',FR:'🇫🇷',IT:'🇮🇹',UK:'🇬🇧'};
let D=null,D2=null,D3=null,charts={};

/* PDF export — clone-based approach to avoid height truncation */
function exportPDF(){
  const btn=document.getElementById('btnPdf');
  btn.disabled=true;btn.textContent='⏳ 生成中...';
  const el=document.getElementById('main');

  // 1. canvas → static img
  const canvasMap=[];
  el.querySelectorAll('canvas').forEach(cv=>{
    try{
      const img=document.createElement('img');
      img.src=cv.toDataURL('image/png');
      img.style.cssText='width:100%;max-height:280px';
      cv.parentNode.insertBefore(img,cv);
      cv.style.display='none';
      canvasMap.push({cv,img});
    }catch(e){}
  });
  Object.keys(charts).forEach(k=>{try{charts[k].destroy()}catch(e){}});

  // 2. hide full cat tables, show only top5 rows; ASIN table top 10
  const allTbodies=el.querySelectorAll('.cat-table tbody');
  const hiddenRows=[];
  allTbodies.forEach(tb=>{
    const rows=tb.querySelectorAll('tr');
    rows.forEach((tr,i)=>{if(i>=5){tr.style.display='none';hiddenRows.push(tr)}});
  });
  const asinTbodies=el.querySelectorAll('.asin-table tbody');
  asinTbodies.forEach(tb=>{
    const rows=tb.querySelectorAll('tr');
    rows.forEach((tr,i)=>{if(i>=10){tr.style.display='none';hiddenRows.push(tr)}});
  });

  // 3. expand scroll containers
  const saved=[];
  el.querySelectorAll('.tw').forEach(t=>{saved.push({el:t,mh:t.style.maxHeight,ov:t.style.overflow});t.style.maxHeight='none';t.style.overflow='visible'});

  // 4. collect sections and render page by page
  const sections=[...el.querySelectorAll('.sec')];
  const pdfMonth=D?D.y26+'-'+D.latest:'';
  const pdfCid=D&&D.cid?'_'+D.cid:'';

  // use jsPDF directly for multi-page
  const {jsPDF}=window.jspdf||{};

  // fallback: use html2pdf with low scale
  const opt={
    margin:[4,3,4,3],
    filename:'EU_MBR_'+pdfMonth+pdfCid+'.pdf',
    image:{type:'jpeg',quality:0.88},
    html2canvas:{
      scale:1,
      useCORS:true,
      logging:false,
      allowTaint:true
    },
    jsPDF:{unit:'mm',format:'a3',orientation:'portrait'},
    pagebreak:{mode:['avoid-all','css'],avoid:['.sub-blk','.summary','.site-hd','.site-blk']}
  };

  html2pdf().set(opt).from(el).save().then(cleanup).catch(err=>{
    console.error('PDF export error:',err);
    cleanup();
    alert('PDF 导出失败：'+err.message);
  });

  function cleanup(){
    btn.disabled=false;btn.textContent='📄 导出 PDF';
    canvasMap.forEach(({cv,img})=>{cv.style.display='';img.remove()});
    hiddenRows.forEach(tr=>{tr.style.display=''});
    saved.forEach(s=>{s.el.style.maxHeight=s.mh;s.el.style.overflow=s.ov});
    charts={};
    render();
  }
}

/* upload */
document.getElementById('fi').onchange=function(e){
  const f=e.target.files[0];if(!f)return;
  const st=document.getElementById('us');st.textContent='解析中...';
  const rd=new FileReader(),isC=/\.(csv|tsv)$/i.test(f.name);
  rd.onload=function(ev){try{
    let rows;
    if(isC)rows=pCSV(ev.target.result);
    else{const wb=XLSX.read(ev.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}
    rows=rows.map(r=>{const o={};Object.keys(r).forEach(k=>{o[k.trim()]=typeof r[k]==='string'?r[k].trim():r[k]});return o}).filter(r=>r['MP']);
    st.textContent='✅ '+rows.length+' 行';
    D=analyze(rows);render();document.getElementById('btnPdf').disabled=false;
    // show CID info
    const cidVal=D.cid||'未识别';
    st.textContent='✅ '+rows.length+' 行 | CID: '+cidVal+' | 数据期间: '+D.y26+'-'+D.mm26[0]+'~'+D.y26+'-'+D.latest;
  }catch(err){st.textContent='❌ '+err.message;console.error(err)}};
  if(isC)rd.readAsText(f,'utf-8');else rd.readAsArrayBuffer(f);
};

/* CID-level upload */
document.getElementById('fi2').onchange=function(e){
  const f=e.target.files[0];if(!f)return;
  const st2=document.getElementById('us2');st2.textContent='解析中...';
  const rd=new FileReader(),isC=/\.(csv|tsv)$/i.test(f.name);
  rd.onload=function(ev){try{
    let rows;
    if(isC)rows=pCSV(ev.target.result);
    else{const wb=XLSX.read(ev.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}
    rows=rows.map(r=>{const o={};Object.keys(r).forEach(k=>{o[k.trim()]=typeof r[k]==='string'?r[k].trim():r[k]});return o}).filter(r=>r['MP']||r['Month']);
    D2=analyzeCID(rows);
    st2.textContent='✅ CID数据 '+rows.length+' 行';
    if(D)render(); // re-render with CID data
  }catch(err){st2.textContent='❌ '+err.message;console.error(err)}};
  if(isC)rd.readAsText(f,'utf-8');else rd.readAsArrayBuffer(f);
};

/* ASIN-level upload */
document.getElementById('fi3').onchange=function(e){
  const f=e.target.files[0];if(!f)return;
  const st3=document.getElementById('us3');st3.textContent='解析中...';
  const rd=new FileReader(),isC=/\.(csv|tsv)$/i.test(f.name);
  rd.onload=function(ev){try{
    let rows;
    if(isC)rows=pCSV(ev.target.result);
    else{const wb=XLSX.read(ev.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}
    rows=rows.map(r=>{const o={};Object.keys(r).forEach(k=>{o[k.trim()]=typeof r[k]==='string'?r[k].trim():r[k]});return o}).filter(r=>r['MP']||r['Month']);
    D3=analyzeASIN(rows);
    st3.textContent='✅ ASIN数据 '+rows.length+' 行';
    if(D)render();
  }catch(err){st3.textContent='❌ '+err.message;console.error(err)}};
  if(isC)rd.readAsText(f,'utf-8');else rd.readAsArrayBuffer(f);
};

function analyzeASIN(raw){
  const rows=raw.map(r=>{
    const site=dS(r['MP']),month=dM(r['Month']);
    if(!site||!month)return null;
    // 兼容多种字段名写法
    const top80Key=Object.keys(r).find(k=>k.replace(/[\s?？]/g,'').toUpperCase().includes('TOP80'));
    const top80Raw=top80Key?r[top80Key]:'';
    const top80Val=top80Raw.toString().trim().toUpperCase();
    const isTop80=(top80Val==='Y'||top80Val==='YES'||top80Val==='TRUE'||top80Val==='1');
    return{site,month,yr:month.slice(0,4),mm:month.slice(5,7),
      asin:(r['ASIN']||'').trim(),parent:(r['Parent ASIN']||'').trim(),
      brand:(r['Brand Name']||'').trim(),
      cat:(r['ITK/BN ENG']||r['ITK/BN']||'').trim(),
      priceBand:(r['ASIN Price Band']||'').trim(),
      asinAge:(r['ASIN Age']||'').trim(),
      isTop80,
      gms:V(r['GMS']),gv:V(r['GV']),units:V(r['Units']),
      cr:P(r['CR']),asp:P(r['ASP']),
      gmsYoY:P(r['GMS YoY']),unitsYoY:P(r['Units YoY']),crYoY:P(r['CR YoY']),aspYoY:P(r['ASP YoY']),
      gmsMoM:P(r['GMS MoM']),
      bmCR:P(r['Benchmark CR']),bmASP:P(r['Benchmark ASP']),
      bmGmsYoY:P(r['Benchmark GMS YoY']),
      gmsPenYoY:P(r['GMS Penetration YoY Change']),
      gvPenYoY:P(r['GV Penetration YoY Change'])};
  }).filter(Boolean);
  const years=[...new Set(rows.map(r=>r.yr))].sort();
  const y26=years.find(y=>y==='2026')||years[years.length-1];
  const y25=years.find(y=>y==='2025')||years[0];
  const r26=rows.filter(r=>r.yr===y26),r25=rows.filter(r=>r.yr===y25);
  const mm26=[...new Set(r26.map(r=>r.mm))].sort();
  const latest=mm26[mm26.length-1];
  const sites=SITES.filter(s=>r26.some(r=>r.site===s));
  // 自动按 GMS 降序算 Top80%（无论原始标记是否存在，都做兜底）
  const latestRows=r26.filter(r=>r.mm===latest);
  const hasTop80=latestRows.some(r=>r.isTop80);
  if(!hasTop80&&latestRows.length){
    // 按 ASIN+站点 聚合 GMS，再按聚合 GMS 降序标记
    const asinMap={};
    latestRows.forEach(r=>{
      const key=r.asin+'_'+r.site;
      if(!asinMap[key])asinMap[key]={gms:0,rows:[]};
      asinMap[key].gms+=r.gms;asinMap[key].rows.push(r);
    });
    const sorted=Object.values(asinMap).sort((a,b)=>b.gms-a.gms);
    const totalGms=sorted.reduce((s,a)=>s+a.gms,0);
    if(totalGms>0){
      let cumGms=0;
      sorted.forEach(a=>{
        cumGms+=a.gms;
        if(cumGms<=totalGms*0.8||a===sorted[0])a.rows.forEach(r=>{r.isTop80=true});
      });
      // 也标记 r26 中对应的历史月份行
      const top80Keys=new Set(sorted.filter(a=>a.rows[0].isTop80).map(a=>a.rows[0].asin+'_'+a.rows[0].site));
      r26.forEach(r=>{if(top80Keys.has(r.asin+'_'+r.site))r.isTop80=true;});
    }
  }
  console.log('[ASIN] 解析完成: '+r26.length+' 行('+y26+'), latest='+latest+', Top80%='+r26.filter(r=>r.mm===latest&&r.isTop80).length+' 条');
  return{rows,r26,r25,y26,y25,latest,mm26,sites};
}

function analyzeCID(raw){
  const rows=raw.map(r=>{
    const site=dS(r['MP']);const month=dM(r['Month']);
    if(!site||!month)return null;
    return{site,month,yr:month.slice(0,4),mm:month.slice(5,7),
      cid:(r['CID']||r['Customer ID']||'').toString().trim(),
      gms:V(r['GMS']),gv:V(r['GV']),units:V(r['Units']),ba:V(r['BA']),cr:P(r['CR']),asp:P(r['ASP']),
      gmsYoY:P(r['GMS YoY']),gmsMoM:P(r['GMS MoM']),crYoY:P(r['CR YoY']),aspYoY:P(r['ASP YoY']),
      newGms:V(r['New GMS']),newGmsPct:P(r['New GMS%']),newUnits:V(r['New Units']),
      fbaGms:V(r['FBA GMS']),fbaGmsPct:P(r['FBA GMS%']),
      promoOps:V(r['Promotion OPS']),promoOpsPct:P(r['Promotion OPS%GMS']),
      dealOps:V(r['Deal OPS']),dealOpsPct:P(r['Deal OPS%GMS']),
      couponOps:V(r['Coupon OPS']),couponOpsPct:P(r['Coupon OPS%GMS']),
      adsSpend:V(r['Ads Spend']),adsSales:V(r['Ads Sales']),adsACOS:P(r['Ads ACOS']),adsROAS:P(r['Ads ROAS']),adsTACOS:P(r['Ads TACOS']),
      adsCTR:P(r['Ads CTR']),adsCPC:P(r['Ads CPC']),adsCVR:P(r['Ads CVR']),
      spSpend:V(r['SP Spend']),spSales:V(r['SP Sales']),spACOS:P(r['SP ACOS']),spROAS:P(r['SP ROAS']),spTACOS:P(r['SP TACOS']),
      sbSpend:V(r['SB Spend']),sbSales:V(r['SB Sales']),sbACOS:P(r['SB ACOS']),sbROAS:P(r['SB ROAS']),
      sdSpend:V(r['SD Spend']),sdSales:V(r['SD Sales']),sdACOS:P(r['SD ACOS']),sdROAS:P(r['SD ROAS']),
      b2bGms:V(r['B2B GMS']),b2bPct:P(r['B2B GMS%']),
      ipi:V(r['IPI Score']),woc:P(r['AVG. WOC']),excessPct:P(r['Excess PCT']),

        const sAdsSpendY=sYoy(sAdsSpend,sAdsSpend5),sAdsSalesY=sYoy(sAdsSales,sAdsSales5);
        if(!isNaN(sAdsSpendY)&&!isNaN(sAdsSalesY)&&sAdsSpendY>sAdsSalesY+10)sDiagItems.push('⚠️ 广告花费增速（+'+sAdsSpendY.toFixed(1)+'%）远超销售增速（+'+sAdsSalesY.toFixed(1)+'%）');

        const sFbaNow=sGms2?(sFbaGms/sGms2*100):0,sFbaPrev=sGms25?(sFbaGms5/sGms25*100):0;
        if(sFbaNow<sFbaPrev-3)sDiagItems.push('⚠️ FBA 占比下降（'+sFbaPrev.toFixed(1)+'%→'+sFbaNow.toFixed(1)+'%）');
        if(sIpi>0&&sIpi<400)sDiagItems.push('⚠️ IPI '+Math.round(sIpi)+'（<400）');
        if(sIpi>0&&sIpi5>0&&sIpi<sIpi5-30)sDiagItems.push('⚠️ IPI 同比下降 '+Math.round(sIpi5)+'→'+Math.round(sIpi)+'（-'+Math.round(sIpi5-sIpi)+'）');
        if(!isNaN(sWoc)&&sWoc>12)sDiagItems.push('⚠️ 库存周转 '+sWoc.toFixed(1)+' 周');
        if(!isNaN(sWoc)&&!isNaN(sWoc5)&&sWoc5>0&&sWoc>sWoc5+3)sDiagItems.push('⚠️ WOC 同比增加 '+sWoc5.toFixed(1)+'→'+sWoc.toFixed(1)+' 周');

    // Build cats from LATEST MONTH data (sL6/sL5) for primary view

    let cats=Object.entries(grpL6).map(([cat,rows])=>{

      if(!isNaN(yoy)&&yoy>30&&g5>100)flags.push({t:'🔥猛增',c:'#1a8c2d',tip:'GMS 同比增长 +'+yoy.toFixed(1)+'%'});
      if(!isNaN(crChg)&&crChg<-0.5)flags.push({t:'CR↓',c:'#d84315',tip:'CR 同比下降 '+Math.abs(crChg).toFixed(2)+'%'});
      if(!prev&&g6>200)flags.push({t:'🆕新品类',c:'#1565c0',tip:'2025同月无数据'});
      return{cat,g6,g5,u6,u5,yoy,cr,bcr,asp,basp,ac,bac,tc,ro,crGap,acGap,crChg,flags,
        tier:rows.find(r=>r.tier)?.tier||'',isTop80:rows.some(r=>r.isTop80)};
    }).sort((a,b)=>b.g6-a.g6);
    // === 品类明细表（最新月份） ===
    h+='<div class="cd"><div class="cd-t">'+s+' 品类明细（'+latest+'月 最新月份）</div><div class="tw"><table class="dt cat-table"><thead><tr><th>品类</th><th>问题标记</th><th>'+latest+'月 GMS</th><th>同期 GMS</th><th>GMS YoY</th><th>Units</th><th>CR</th><th>BM CR</th><th>CR vs BM</th><th>ASP</th><th>SP ACOS</th><th>BM ACOS</th><th>ACOS vs BM</th><th>SP ROAS</th></tr></thead><tbody>';
    cats.forEach(c=>{
      const flagsHtml=c.flags.length?c.flags.map(f=>'<span style="display:inline-block;padding:1px 4px;border-radius:3px;font-size:.6rem;font-weight:600;color:#fff;background:'+f.c+';margin-right:2px" title="'+f.tip+'">'+f.t+'</span>').join(''):'<span style="color:#aaa;font-size:.6rem">—</span>';

      h+='<tr><td>'+c.cat+'</td><td style="text-align:left">'+flagsHtml+'</td><td>'+fK(c.g6)+'</td><td>'+fK(c.g5)+'</td><td>'+tHraw(c.yoy)+'</td><td>'+fN(c.u6)+'</td><td>'+fP(c.cr)+'</td><td>'+fP(c.bcr)+'</td><td>'+crVsBm+'</td><td>'+fD(c.asp)+'</td><td>'+fP(c.ac)+'</td><td>'+fP(c.bac)+'</td><td>'+acVsBm+'</td><td>'+fR(c.ro)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    // === 品类发现（精简版：按GMS占比排序，对比BM给建议） ===
    const totalSiteGms=sum(cats,'g6');
    const topCats=cats.filter(c=>c.g6>0).slice(0,5); // Top 5 by GMS
    if(topCats.length){

        const share=totalSiteGms?(c.g6/totalSiteGms*100):0;
        let note='';
        // CR vs BM
        if(!isNaN(c.crGap)){
          if(c.crGap<-0.3)note+='CR 低于 BM '+Math.abs(c.crGap).toFixed(2)+'%';
          else if(c.crGap>0.3)note+='CR 优于 BM +'+c.crGap.toFixed(2)+'% ✅';

        // ACOS vs BM

        insightTxt+='　• <b>'+c.cat+'</b>（占比 '+share.toFixed(1)+'%，GMS '+fK(c.g6)+'）：'+note+'<br>';
      });
      h+='<div class="summary" style="word-break:break-word">'+insightTxt+'</div>';
    }
    h+='</div>'; /* close site-blk */
  });
  h+='</div>'; /* close sec-2 */

  /* ============ SECTION ASIN: ASIN 级分析（按 ASIN 聚合） ============ */
  if(D3){
    h+='<div class="sec sec-asin">';
    const aLatest=D3.latest;
    h+='<div class="st">🔬 ASIN 级分析（Top 80% GMS · '+aLatest+'月）</div>';
    h+='<div class="ss">仅展示 GMS Top80% 的 ASIN，按 GMS 降序，对比 Benchmark</div>';

    // 兜底：如果 Top80% 标记仍为空，直接取最新月所有 ASIN 按 GMS 降序截取到 80%

      const latAll=D3.r26.filter(r=>r.mm===aLatest&&r.gms>0).sort((a,b)=>b.gms-a.gms);
      const tot=latAll.reduce((s,r)=>s+r.gms,0);
      let cum=0;
      allAsins=latAll.filter(r=>{cum+=r.gms;return cum<=tot*0.8||r===latAll[0]});
    }
    const totalGms=allAsins.reduce((s,r)=>s+r.gms,0);

    if(allAsins.length){
      // 明细表
      h+='<div class="cd"><div class="cd-t">ASIN 明细（'+allAsins.length+' 条 Top80% 记录）</div><div class="tw"><table class="dt asin-table"><thead><tr>';
      h+='<th>ASIN</th><th>站点</th><th>品类</th><th>GMS</th><th>占比</th><th>GMS YoY</th><th>Units</th><th>CR</th><th>BM CR</th><th>CR vs BM</th><th>ASP</th><th>BM ASP</th><th>渗透率 YoY</th><th>状态</th>';
      h+='</tr></thead><tbody>';

        const crGap=(!isNaN(a.cr)&&!isNaN(a.bmCR))?(pct(a.cr)-pct(a.bmCR)):NaN;
        const gmsY=pct(a.gmsYoY);
        const penY=pct(a.gmsPenYoY);

        const flags=[];
        if(!isNaN(crGap)&&crGap>0.3)flags.push({t:'CR✅',c:'var(--g)',tip:'CR 优于 BM +'+crGap.toFixed(2)+'%'});
        if(!isNaN(crGap)&&crGap<-0.3)flags.push({t:'CR⚠️',c:'var(--r)',tip:'CR 低于 BM '+Math.abs(crGap).toFixed(2)+'%'});
        if(!isNaN(gmsY)&&gmsY>20)flags.push({t:'GMS↑',c:'var(--g)',tip:'GMS YoY +'+gmsY.toFixed(1)+'%'});
        if(!isNaN(gmsY)&&gmsY<-15)flags.push({t:'GMS↓',c:'var(--r)',tip:'GMS YoY '+gmsY.toFixed(1)+'%'});
        if(!isNaN(penY)&&penY<-0.3)flags.push({t:'份额↓',c:'var(--r)',tip:'渗透率 YoY '+penY.toFixed(2)+'%'});

        const crVsBm=!isNaN(crGap)?'<span style="color:'+(crGap>=0?'var(--g)':'var(--r)')+';font-weight:600">'+(crGap>=0?'+':'')+crGap.toFixed(2)+'pp</span>':'—';
        const flagsHtml=flags.length?flags.map(f=>'<span style="display:inline-block;padding:1px 4px;border-radius:3px;font-size:.6rem;font-weight:600;color:#fff;background:'+f.c+';margin-right:2px" title="'+f.tip+'">'+f.t+'</span>').join(''):'—';

        h+='<tr><td style="font-family:monospace;font-size:.68rem">'+a.asin+'</td>';

    }

  }

  /* ============ SECTION 4: 综合总结（CID + ITK + ASIN） ============ */
  h+='<div class="sec sec-4">';
  h+='<div class="st">🚀 综合总结</div><div class="ss">基于 CID / ITK / ASIN 三维数据 · '+y26+'-'+latest+'</div>';
  h+='<div class="il" id="dSum"></div>';
  h+='</div>'; /* close sec-4 */

function renderSummary(){
  const{r26,r25,y26,y25,overlap,latest,sites}=D;
  const rL6=r26.filter(r=>r.mm===latest),rL5=r25.filter(r=>r.mm===latest);

  const ytdYoY=tg5?(tg6-tg5)/tg5*100:NaN;

  const items=[];

  // --- 1. 全站 GMS 趋势（ITK） ---
  let t1='📊 全站 '+latest+'月 GMS '+fK(lg6);
  if(!isNaN(gYoY))t1+='，同比 '+(gYoY>=0?'+':'')+gYoY.toFixed(1)+'%';
  t1+='；YTD '+fK(tg6);
  if(!isNaN(ytdYoY))t1+='，同比 '+(ytdYoY>=0?'+':'')+ytdYoY.toFixed(1)+'%';
  // 找增长最快和下滑最多的站点
  let bestS=null,bestY=-Infinity,worstS=null,worstY=Infinity;
  sites.forEach(s=>{
    const g5=sum(rOl5.filter(r=>r.site===s),'gms'),g6=sum(rOl6.filter(r=>r.site===s),'gms');
    if(g5>0){const y=(g6-g5)/g5*100;if(y>bestY){bestY=y;bestS=s}if(y<worstY){worstY=y;worstS=s}}
  });
  let p1='';
  if(bestS&&bestY>0)p1+=FL[bestS]+bestS+' YTD 增速最快 +'+bestY.toFixed(1)+'%';
  if(worstS&&worstY<0)p1+=(p1?'；':'')+FL[worstS]+worstS+' YTD 下滑 '+Math.abs(worstY).toFixed(1)+'%';
  items.push({t:t1,p:p1,c:(!isNaN(gYoY)&&gYoY<0)?'':'op'});

  // --- 2. 广告效率（CID） ---
  if(D2){
    const c2L=D2.r26.filter(r=>r.mm===D2.latest),c2L5=D2.r25.filter(r=>r.mm===D2.latest);
    const tAdsSpend=sum(c2L,'adsSpend'),tAdsSales=sum(c2L,'adsSales');
    const tAdsSpend5=sum(c2L5,'adsSpend'),tAdsSales5=sum(c2L5,'adsSales');
    const aACOS=wA(c2L,'adsACOS'),aROAS=wA(c2L,'adsROAS');
    const aACOS5=wA(c2L5,'adsACOS'),aROAS5=wA(c2L5,'adsROAS');
    const acosChg=(!isNaN(aACOS)&&!isNaN(aACOS5))?(pct(aACOS)-pct(aACOS5)):NaN;
    const spendY=tAdsSpend5?(tAdsSpend-tAdsSpend5)/tAdsSpend5*100:NaN;
    const salesY=tAdsSales5?(tAdsSales-tAdsSales5)/tAdsSales5*100:NaN;
    let t2='💰 广告花费 '+fK(tAdsSpend);
    if(!isNaN(spendY))t2+='（YoY '+(spendY>=0?'+':'')+spendY.toFixed(1)+'%）';
    t2+='，ACOS '+fP(aACOS);
    if(!isNaN(acosChg))t2+='（'+(acosChg>=0?'+':'')+acosChg.toFixed(2)+'pp）';
    t2+='，ROAS '+fR(aROAS);
    let p2='广告销售 '+fK(tAdsSales);
    if(!isNaN(salesY))p2+='（YoY '+(salesY>=0?'+':'')+salesY.toFixed(1)+'%）';
    if(!isNaN(spendY)&&!isNaN(salesY)&&spendY>salesY+10)p2+='；花费增速超过销售增速 '+(spendY-salesY).toFixed(1)+'%';
    items.push({t:t2,p:p2,c:(!isNaN(acosChg)&&acosChg>2)?'':'op'});

    // --- 3. 库存健康（CID） ---
    const avgIpi=c2L.reduce((s,r)=>s+(r.ipi||0),0)/Math.max(c2L.filter(r=>r.ipi>0).length,1);
    const avgWoc=c2L.reduce((s,r)=>s+(r.woc||0),0)/Math.max(c2L.filter(r=>r.woc>0).length,1);
    const avgExc=wA(c2L,'excessPct');
    if(avgIpi>0||avgWoc>0){
      let t3='📦 库存：IPI '+(avgIpi>0?Math.round(avgIpi):'—')+'，WOC '+(avgWoc>0?avgWoc.toFixed(1)+'周':'—');
      if(!isNaN(avgExc))t3+='，冗余 '+fP(avgExc);
      let p3='';
      const avgIpi5=c2L5.length?c2L5.reduce((s,r)=>s+(r.ipi||0),0)/Math.max(c2L5.filter(r=>r.ipi>0).length,1):NaN;
      const avgWoc5=c2L5.length?c2L5.reduce((s,r)=>s+(r.woc||0),0)/Math.max(c2L5.filter(r=>r.woc>0).length,1):NaN;
      if(avgIpi>0&&avgIpi5>0)p3+='IPI 同比 '+(avgIpi>avgIpi5?'+':'')+Math.round(avgIpi-avgIpi5);
      if(avgWoc>0&&avgWoc5>0)p3+=(p3?'；':'')+'WOC 同比 '+(avgWoc>avgWoc5?'+':'')+((avgWoc-avgWoc5)).toFixed(1)+'周';
      const isBad=(avgIpi>0&&avgIpi<400)||(!isNaN(avgWoc)&&avgWoc>12);
      items.push({t:t3,p:p3,c:isBad?'w':'op'});
    }
  }

  // --- 4. 品类 vs BM（ITK） ---
  const allCrGaps=[],allAcGaps=[];
  sites.forEach(s=>{
    const sL6=rL6.filter(r=>r.site===s);
    const cr=wA(sL6,'cr'),bcr=wA(sL6,'bmCR'),ac=wA(sL6,'spACOS'),bac=wA(sL6,'bmSpACOS');
    const crG=(!isNaN(cr)&&!isNaN(bcr))?(pct(cr)-pct(bcr)):NaN;
    const acG=(!isNaN(ac)&&!isNaN(bac))?(pct(ac)-pct(bac)):NaN;
    if(!isNaN(crG))allCrGaps.push({s,crG,cr,bcr});
    if(!isNaN(acG))allAcGaps.push({s,acG,ac,bac});
  });
  if(allCrGaps.length){
    const worst=allCrGaps.sort((a,b)=>a.crG-b.crG)[0];
    const best=allCrGaps[allCrGaps.length-1];
    let t4='📈 CR vs BM：';
    if(worst.crG<-0.3)t4+=FL[worst.s]+worst.s+' CR 低于 BM '+Math.abs(worst.crG).toFixed(2)+'pp（'+fP(worst.cr)+' vs '+fP(worst.bcr)+'）';
    else t4+='各站点 CR 均接近或优于 BM';
    let p4='';
    if(best.crG>0.3)p4+=FL[best.s]+best.s+' CR 优于 BM +'+best.crG.toFixed(2)+'%';
    const worstAc=allAcGaps.sort((a,b)=>b.acG-a.acG)[0];
    if(worstAc&&worstAc.acG>2)p4+=(p4?'；':'')+FL[worstAc.s]+worstAc.s+' ACOS 高于 BM '+worstAc.acG.toFixed(1)+'%';
    items.push({t:t4,p:p4,c:(worst.crG<-0.5)?'w':'op'});
  }

  // --- 5. ASIN 级亮点/机会（ASIN） ---
  if(D3){
    const aLatest=D3.latest;
    const allA=D3.r26.filter(r=>r.mm===aLatest&&r.isTop80).sort((a,b)=>b.gms-a.gms);
    if(allA.length){
      const topA=allA.slice(0,3);
      // 找 CR 最低于 BM 的 ASIN
      const withCrGap=allA.map(a=>{
        const crG=(!isNaN(a.cr)&&!isNaN(a.bmCR))?(pct(a.cr)-pct(a.bmCR)):NaN;
        return{...a,crG};
      }).filter(a=>!isNaN(a.crG));
      const worstCr=withCrGap.sort((a,b)=>a.crG-b.crG).slice(0,2);
      const bestCr=withCrGap.sort((a,b)=>b.crG-a.crG).slice(0,2);

      let t5='🔬 ASIN：Top 3 为 '+topA.map(a=>a.asin+'（'+FL[a.site]+fK(a.gms)+'）').join('、');
      let p5='';
      if(worstCr.length&&worstCr[0].crG<-0.3){
        p5+='CR 机会点：'+worstCr.filter(a=>a.crG<-0.3).map(a=>a.asin+'（'+FL[a.site]+a.site+'，CR '+fP(a.cr)+' vs BM '+fP(a.bmCR)+'，差 '+Math.abs(a.crG).toFixed(2)+'pp）').join('；');
      }
      if(bestCr.length&&bestCr[0].crG>0.3){
        p5+=(p5?'。':'')+'CR 领先：'+bestCr.filter(a=>a.crG>0.3).map(a=>a.asin+'（'+FL[a.site]+a.site+'，+'+a.crG.toFixed(2)+'pp）').join('；');
      }
      items.push({t:t5,p:p5,c:'op'});
    }
  }

  // 渲染
  const el=document.getElementById('dSum');
  if(!el)return;
  el.innerHTML=items.slice(0,5).map((it,i)=>{
    const cls='ic'+(it.c?' '+it.c:'');
    return '<div class="'+cls+'"><h4><span class="nm">'+(i+1)+'</span>'+it.t+'</h4>'+(it.p?'<p>'+it.p+'</p>':'')+'</div>';
  }).join('')||'<p style="color:#888">暂无数据</p>';
}
</script>
</body>
</html>
